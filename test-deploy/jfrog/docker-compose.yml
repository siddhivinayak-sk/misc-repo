version: '3.8'

services:
  artifactory-db:
    image: docker.io/library/postgres:15-alpine
    container_name: artifactory-db
    restart: always
    environment:
      - POSTGRES_DB=artifactory
      - POSTGRES_USER=artifactory
      - POSTGRES_PASSWORD=password123
    volumes:
      - artifactory_db_vol:/var/lib/postgresql/data:Z
    networks:
      - artifactory_net

  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:latest
    container_name: artifactory
    restart: always
    user: "root"
    depends_on:
      - artifactory-db
    ports:
      - "8081:8081"
      - "8082:8082"
    environment:
      - JF_ROUTER_ENTRYPOINTS_EXTERNALPORT=8082
      - JF_SHARED_SECURITY_MASTERKEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - JF_SHARED_SECURITY_JOINKEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      # Database connections
      - JF_SHARED_DATABASE_TYPE=postgresql
      - JF_SHARED_DATABASE_DRIVER=org.postgresql.Driver
      - JF_SHARED_DATABASE_URL=jdbc:postgresql://artifactory-db:5432/artifactory
      - JF_SHARED_DATABASE_USERNAME=artifactory
      - JF_SHARED_DATABASE_PASSWORD=password123
      # FIXED FOR PODMAN LOOPS: Overrides IPv6 address priority networks
      - EXTRA_JAVA_OPTIONS=-Xms512m -Xmx2g -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true
    volumes:
      - artifactory_vol:/var/opt/jfrog/artifactory:Z
    networks:
      - artifactory_net

volumes:
  artifactory_vol:
    driver: local
  artifactory_db_vol:
    driver: local

networks:
  artifactory_net:
    driver: bridge
